{% if cities %}
<p class="np-dropdown__hint" id="np-city-hint">Оберіть місто зі списку:</p>
<select class="form-select np-city-select" id="np-city-select" size="{% if cities|length > 8 %}8{% else %}{{ cities|length }}{% endif %}">
  {% for city in cities %}
  <option value="{{ city.Ref }}" data-name="{{ city.Description }}">
    {{ city.Description }}{% if city.AreaDescription %}, {{ city.AreaDescription }} обл.{% endif %}
  </option>
  {% endfor %}
</select>
{% elif query %}
<p class="np-dropdown__empty" id="np-city-hint">Нічого не знайдено за «{{ query }}»</p>
{% else %}
<p class="np-dropdown__empty" id="np-city-hint">Введіть мінімум 2 літери</p>
{% endif %}
