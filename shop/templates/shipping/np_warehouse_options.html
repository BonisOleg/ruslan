{% if warehouses %}
<label class="np-dropdown__hint" for="np-warehouse-select">Оберіть відділення:</label>
<select class="form-select" id="np-warehouse-select">
  <option value="">— Оберіть відділення —</option>
  {% for w in warehouses %}
  <option value="{{ w.Ref }}" data-address="{{ w.Description }}">
    {{ w.Description }}
  </option>
  {% endfor %}
</select>
{% else %}
<p class="np-dropdown__empty">Відділення не знайдено</p>
{% endif %}
